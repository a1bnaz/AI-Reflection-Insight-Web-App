spring.application.name=idea1 backend

spring.security.user.name=user
spring.security.user.password=123

# JWT Configuration
# Generated secure random secret (44 characters, base64 encoded)
# To generate a new one, run: openssl rand -base64 32
jwt.secret=${JWT_SECRET}

# open AI secret key
openai.api.key=${OPENAI_API_KEY}

# port configuration for render
# uses render's port if provided, otherwise default to 8080 locally
server.port = ${PORT:8080}

# tells spring to load a local .env file when you run locally. in production, it will use real environment variables instead.
spring.config.import=optional:file:.env[.properties]

# defaults to local dev profile unless SPRING_PROFILES_ACTIVE is set explicitly
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}